spring.application.name=resumeforge-backend-test

# Database Configuration with safe test placeholders
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/resumeforge_test}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false

# Gemini / OpenAI API Configuration (Safe test placeholders)
GEMINI_API_KEY=${GEMINI_API_KEY:test-dummy-gemini-key}
spring.ai.openai.api-key=${GEMINI_API_KEY:test-dummy-gemini-key}
spring.ai.openai.base-url=https://generativelanguage.googleapis.com/v1beta/openai
spring.ai.openai.chat.options.model=gemini-2.5-flash

# Multipart
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# JWT Configuration (Safe test placeholder)
jwt.secret=${JWT_SECRET:UmVzdW1lRm9yZ2VBSS1KV1QtU2VjcmV0LUtleS1UZXN0LUR1bW15LVBsYWNlaG9sZGVyLTIwMjY=}
jwt.expiration=86400000
