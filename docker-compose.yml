services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: resumeforge-backend
    ports:
      - "8081:8080"
    env_file:
      - .env
    environment:
      - SERVER_PORT=8080
    volumes:
      - resume_uploads:/app/uploads
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: resumeforge-frontend
    ports:
      - "3000:80"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  resume_uploads: